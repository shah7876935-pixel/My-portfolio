<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>layout probe</title>
</head>
<body>
    <pre id="out">PENDING</pre>
    <script>
        const params = new URLSearchParams(location.search);
        const widths = (params.get("w") || "1440").split(",").map(Number);

        function rectOf(el, label) {
            if (!el) return { label, missing: true };
            const r = el.getBoundingClientRect();
            return {
                label,
                x: Math.round(r.left), y: Math.round(r.top),
                w: Math.round(r.width), h: Math.round(r.height),
                right: Math.round(r.right), bottom: Math.round(r.bottom)
            };
        }

        function overlap(a, b) {
            if (!a || !b || a.missing || b.missing) return 0;
            const w = Math.min(a.right, b.right) - Math.max(a.x, b.x);
            const h = Math.min(a.bottom, b.bottom) - Math.max(a.y, b.y);
            return (w > 0 && h > 0) ? Math.round(w) + "x" + Math.round(h) : "none";
        }

        async function measure(width) {
            return new Promise((resolve) => {
                const frame = document.createElement("iframe");
                frame.style.cssText = "width:" + width + "px;height:900px;border:0;";
                frame.src = "index.html";

                frame.onload = () => {
                    setTimeout(() => {
                        const d = frame.contentDocument;
                        const w = frame.contentWindow;

                        const q = (s) => d.querySelector(s);

                        const visual = q(".hero-visual");
                        const portrait = q(".hero-portrait");
                        const ringOut = q(".hero-ring-outer");
                        const card = q(".console-card");
                        const grid = q(".hero-grid");
                        const textBox = q(".hero-text");

                        const textParts = Array.from(d.querySelectorAll(
                            ".hero-text > *, .hero-text h1, .hero-text h2, .hero-lead, .buttons, .hero-chips, .small-title"
                        ));

                        const targets = {
                            portrait: rectOf(portrait, "portrait"),
                            visual: rectOf(visual, "visual"),
                            ringOuter: rectOf(ringOut, "ringOuter"),
                            consoleCard: rectOf(card, "consoleCard"),
                            grid: rectOf(grid, "grid"),
                            heroText: rectOf(textBox, "heroText")
                        };

                        // Does any hero text part collide with the photo or its decorations?
                        const collisions = [];
                        textParts.forEach((el) => {
                            const r = rectOf(el, "text:" + (el.className || el.tagName));
                            const withPortrait = overlap(r, targets.portrait);
                            const withVisual = overlap(r, targets.visual);
                            const withRing = overlap(r, targets.ringOuter);
                            if (withPortrait !== "none" || withVisual !== "none" || withRing !== "none") {
                                collisions.push({
                                    part: r.label,
                                    rect: r,
                                    withPortrait: withPortrait,
                                    withVisual: withVisual,
                                    withRing: withRing
                                });
                            }
                        });

                        // Does the text column spill into the visual column?
                        const textRight = targets.heroText.missing ? null : targets.heroText.right;
                        const visualLeft = targets.visual.missing ? null : targets.visual.x;

                        // Computed styles for the pieces that decide the layout
                        const cs = (el) => {
                            if (!el) return null;
                            const s = w.getComputedStyle(el);
                            return {
                                width: s.width, height: s.height,
                                aspectRatio: s.aspectRatio,
                                position: s.position,
                                paddingLeft: s.paddingLeft, paddingRight: s.paddingRight,
                                marginLeft: s.marginLeft, marginRight: s.marginRight,
                                transform: s.transform, translate: s.translate,
                                borderTopWidth: s.borderTopWidth
                            };
                        };

                        resolve({
                            viewport: width,
                            iframeClientWidth: d.documentElement.clientWidth,
                            docScrollWidth: d.documentElement.scrollWidth,
                            docClientWidth: d.documentElement.clientWidth,
                            horizontalOverflow: d.documentElement.scrollWidth > d.documentElement.clientWidth,
                            rects: targets,
                            computed: {
                                grid: cs(grid),
                                heroText: cs(textBox),
                                visual: cs(visual),
                                ringOuter: cs(ringOut),
                                ringInner: cs(q(".hero-ring-inner")),
                                portrait: cs(portrait),
                                consoleCard: cs(card)
                            },
                            textRight: textRight,
                            visualLeft: visualLeft,
                            gapBetweenColumns:
                                (textRight !== null && visualLeft !== null) ? (visualLeft - textRight) : null,
                            gridColumns: w ? w.getComputedStyle(grid).gridTemplateColumns : null,
                            fontsLoaded: d.fonts ? d.fonts.check("16px Sora") : null,
                            collisions: collisions
                        });

                        frame.remove();
                    }, 2600);
                };

                d_append(frame);
            });
        }

        function d_append(n) { document.body.appendChild(n); }

        (async () => {
            const results = [];
            for (const w of widths) {
                results.push(await measure(w));
            }
            document.getElementById("out").textContent =
                "RESULT_START" + JSON.stringify(results, null, 1) + "RESULT_END";
        })();
    </script>
</body>
</html>
